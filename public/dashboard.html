<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Legacy</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="theme-color" content="#ece7dc">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">
            <h1 class="brand">Garden <span>Legacy</span></h1>
            <div class="date" id="today-label"></div>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-mono tall desktop-only" id="theme-toggle" type="button"></button>
            <a class="btn btn-accent btn-hard desktop-only" href="/plant.html">+ Add plant</a>
        </div>
    </header>

    <div class="alert" id="alert" role="alert" hidden></div>

    <div class="layout" id="content" hidden>
        <aside aria-labelledby="reminders-title">
            <h2 class="fold-heading">
                <button class="section-head fold-head" id="reminders-toggle" type="button" aria-expanded="true">
                    <span class="fold-title">
                        <span class="h-section" id="reminders-title">Reminders</span>
                        <span class="count" id="reminders-count"></span>
                    </span>
                    <span class="fold-state" id="reminders-state"></span>
                </button>
            </h2>
            <div id="reminders"></div>
        </aside>
        <main id="groups"></main>
    </div>

    <a class="fab-bar" href="/plant.html">+ Add plant</a>

    <script type="module" src="/js/dashboard.js"></script>
    <script type="module" src="/js/pwa.js"></script>
</body>
</html>
