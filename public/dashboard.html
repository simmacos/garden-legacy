<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Legacy</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">
            <h1 class="brand">Garden <span>Legacy</span></h1>
            <div class="date" id="today-label"></div>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-mono tall desktop-only" id="theme-toggle" type="button"></button>
            <a class="btn btn-accent btn-hard desktop-only" href="/plant.html">+ Add plant</a>
        </div>
    </header>

    <div class="alert" id="alert" role="alert" hidden></div>

    <div class="layout" id="content" hidden>
        <aside aria-labelledby="reminders-title">
            <div class="section-head">
                <h2 class="h-section" id="reminders-title">Reminders</h2>
                <span class="count" id="reminders-count"></span>
            </div>
            <div id="reminders"></div>
        </aside>
        <main id="groups"></main>
    </div>

    <a class="fab-bar" href="/plant.html">+ Add plant</a>

    <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
