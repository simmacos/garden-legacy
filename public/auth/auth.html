<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Garden Legacy</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="theme-color" content="#ece7dc">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <button class="btn btn-mono login-theme" id="theme-toggle" type="button"></button>

    <main class="login">
        <div class="login-card">
            <h1 class="brand">Garden Legacy</h1>
            <p class="sub">Sign in to your notebook</p>

            <form id="loginForm" method="post" action="/api/auth/login">
                <div class="field">
                    <label for="user">Username</label>
                    <input class="input" id="user" type="text" name="user" autocomplete="username" autocapitalize="none" required>
                </div>
                <div class="field">
                    <label for="pass">Password</label>
                    <input class="input" id="pass" type="password" name="pass" autocomplete="current-password" required>
                </div>
                <div class="alert" id="alert" role="alert" hidden></div>
                <button class="btn btn-accent btn-hard btn-lg" id="submit" type="submit">Sign in</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { initThemeToggle } from "/js/lib.js";

        initThemeToggle(document.getElementById("theme-toggle"));

        const alertBox = document.getElementById("alert");
        const submit = document.getElementById("submit");

        const showError = message => {
            alertBox.textContent = `◆ ${message}`;
            alertBox.hidden = false;
        };

        // Già loggato -> dashboard
        fetch("/api/me").then(res => { if (res.ok) window.location.href = "/dashboard.html"; }).catch(() => {});

        document.getElementById("loginForm").addEventListener("submit", async event => {
            // Login via fetch: il form nativo ricaricherebbe la pagina
            event.preventDefault();
            alertBox.hidden = true;

            const data = Object.fromEntries(new FormData(event.target).entries());
            submit.disabled = true;
            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    if (response.status === 401) showError("Wrong username or password");
                    else if (response.status === 429) showError((await response.json().catch(() => null))?.message || "Too many login attempts, try again later");
                    else showError("Could not sign in, try again");
                    return;
                }

                // Salva le credenziali nel password manager (serve perché si usa fetch e non un submit nativo)
                try {
                    if (window.PasswordCredential) {
                        await navigator.credentials.store(new PasswordCredential({
                            id: String(data.user || ""),
                            password: String(data.pass || "")
                        }));
                    }
                } catch (e) {
                    console.warn("Password manager non disponibile:", e);
                }

                window.location.href = "/dashboard.html";
            } catch (error) {
                console.error("Network error:", error);
                showError("Network error, try again");
            } finally {
                submit.disabled = false;
            }
        });
    </script>
    <script type="module" src="/js/pwa.js"></script>
</body>
</html>
